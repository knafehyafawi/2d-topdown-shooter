<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- glow: bright center fading out to nothing -->
    <radialGradient id="glow" cx="50%" cy="50%" r="30%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- vignette: nothing in the middle, darkening at the edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="45%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="95%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" fill="#260000"/>           <!-- base -->
  <rect width="128" height="128" fill="url(#glow)"/>        <!-- glow -->
  <rect x="44" y="44" width="40" height="40" fill="#fff"/>  <!-- square -->
  <rect width="128" height="128" fill="url(#vignette)"/>    <!-- vignette -->
</svg>